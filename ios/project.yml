name: Transit
options:
  bundleIdPrefix: dev.suddsy.transit
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  TransitCore:
    path: Packages/TransitCore

targets:
  Transit:
    type: application
    platform: iOS
    sources:
      - path: Transit
    dependencies:
      - package: TransitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.suddsy.transit
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Transit
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to show nearby stops, your position on the map, and to time walking directions."

schemes:
  Transit:
    build:
      targets:
        Transit: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
